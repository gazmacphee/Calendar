<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Availability Calendar</title>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        #calendar {
            max-width: 900px;
            margin: auto;
        }
        .popup {
            display: none;
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border: 2px solid black;
            z-index: 1000;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.5);
            width: 400px;
            height: 350px; /* Adjusted height */
            text-align: center;
            overflow-y: auto;
        }
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 999;
        }
        .popup-row {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <h2>Weekly Availability Calendar</h2>
    <div id="calendar"></div>

    <div id="popup-overlay" class="popup-overlay"></div>
    <div id="popup" class="popup">
        <h3 id="popup-date"></h3>

        <div class="popup-row">
            <label for="name">Your Name:</label>
            <select id="name">
                <option value="">Select Name</option>
                <option value="Paul">Paul</option>
                <option value="Tracey">Tracey</option>
                <option value="Susan">Susan</option>
            </select>
        </div>

        <div class="popup-row">
            <label><input type="checkbox" id="morning_walk"> Morning Walk</label>
        </div>

        <div class="popup-row">
            <label><input type="checkbox" id="dinner"> Dinner</label>
        </div>

        <div class="popup-row">
            <label><input type="checkbox" id="evening_walk"> Evening Walk</label>
        </div>

        <button onclick="submitAvailability()">Submit</button>
        <button onclick="closePopup()">Cancel</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                selectable: true,
                dateClick: function(info) {
                    openPopup(info.dateStr);
                }
            });
            calendar.render();
        });

        function openPopup(date) {
            document.getElementById("popup-overlay").style.display = "block";
            document.getElementById("popup").style.display = "block";
            document.getElementById("popup-date").textContent = "Select availability for " + date;
            document.getElementById("popup").setAttribute("data-date", date);
        }

        function closePopup() {
            document.getElementById("popup-overlay").style.display = "none";
            document.getElementById("popup").style.display = "none";
        }


        function submitAvailability() {
            var date = document.getElementById("popup").getAttribute("data-date");
            var name = document.getElementById("name").value;
            var morning_walk = document.getElementById("morning_walk").checked ? "Yes" : "No";
            var dinner = document.getElementById("dinner").checked ? "Yes" : "No";
            var evening_walk = document.getElementById("evening_walk").checked ? "Yes" : "No";
        
            if (!date || !name) {
                alert("Error: Missing date or name.");
                return;
            }
        
            var queryParams = new URLSearchParams({
                date: date,
                name: name,
                morning_walk: morning_walk,
                dinner: dinner,
                evening_walk: evening_walk
            }).toString();
        
            fetch("https://script.google.com/macros/s/AKfycbzNQM74I3riTnxkYEPflWum9KYWvZMqWCyKzKAIk6m_hwxDleaw2MPLRzWCyrTGSIng/exec?" + queryParams, { 
                method: "GET",
                mode: "cors"
            })
            .then(response => response.text())
            .then(text => {
                try {
                    const jsonResponse = JSON.parse(text);
                    if (jsonResponse.status === "Success") {
                        alert("Availability submitted successfully!");
                        closePopup();
                        // ✅ Clear previous selections AFTER submission
                        document.getElementById("name").value = "";
                        document.getElementById("morning_walk").checked = false;
                        document.getElementById("dinner").checked = false;
                        document.getElementById("evening_walk").checked = false;
                    } else {
                        alert("Error submitting availability: " + (jsonResponse.message || "Unknown error"));
                    }
                } catch (error) {
                    console.error("JSON Parse Error:", error, "Response text:", text);
                    alert("Error parsing response from server. Check console.");
                }
            })
            .catch(error => {
                console.error("Network Error:", error);
                alert("Failed to submit. Check console for details.");
            });
        }
    </script>

</body>
</html>
